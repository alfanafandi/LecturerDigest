<!DOCTYPE html>

<html class="light" lang="id"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&amp;family=Inter:wght@400;500;600&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>

                    "inverse-on-surface": "#f0f1f2",

                    "on-error-container": "#93000a",

                    "surface-tint": "#006b5c",

                    "headline": ["Plus Jakarta Sans"],

                    "label": ["Inter"]

        },
      }

<style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        .glass-effect {
            backdrop-filter: blur(24px);
            -webkit-backdrop-filter: blur(24px);
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-surface font-body text-on-surface selection:bg-primary-container/30">
<!-- Top Navigation Suppression: Not shown for Transactional Login Flow -->
<main class="min-h-screen flex flex-col items-center justify-between px-6 py-12 md:max-w-md md:mx-auto">
<!-- Header Section -->
<div class="w-full flex flex-col items-center text-center mt-8">
<div class="w-16 h-16 rounded-2xl bg-gradient-to-br from-primary to-primary-container flex items-center justify-center shadow-[0px_12px_32px_rgba(0,107,92,0.15)] mb-6">
<span class="material-symbols-outlined text-white text-3xl" data-icon="school">school</span>
</div>
<h1 class="font-headline font-black text-3xl tracking-tight bg-clip-text text-transparent bg-gradient-to-br from-primary to-primary-container">
                LectureDigest
            </h1>
<p class="mt-4 font-headline font-bold text-2xl text-on-surface tracking-tight">
                Selamat Datang Kembali!
            </p>
<p class="mt-2 text-on-surface-variant font-medium text-sm">
                Masuk untuk mengakses ringkasan kuliahmu.
            </p>
</div>
<!-- Form Section -->
<div class="w-full flex-1 flex flex-col justify-center mt-12 space-y-6">
<!-- Email Input -->
<div class="space-y-1.5">
<label class="text-xs font-bold uppercase tracking-widest text-primary px-1" for="email">Email</label>
<div class="relative group">
<div class="absolute inset-y-0 left-0 pl-4 flex items-center pointer-events-none">
<span class="material-symbols-outlined text-on-surface-variant group-focus-within:text-primary transition-colors" data-icon="mail">mail</span>
</div>
<input class="block w-full pl-12 pr-4 py-4 bg-surface-container-high border-none rounded-2xl focus:ring-2 focus:ring-primary/20 focus:bg-surface-container-lowest transition-all placeholder:text-outline-variant text-on-surface" id="email" placeholder="nama@mahasiswa.ac.id" type="email"/>
</div>
</div>
<!-- Password Input -->
<div class="space-y-1.5">
<div class="flex justify-between items-center px-1">
<label class="text-xs font-bold uppercase tracking-widest text-primary" for="password">Password</label>
<a class="text-xs font-bold text-primary hover:text-primary-container transition-colors" href="#">Lupa Password?</a>
</div>
<div class="relative group">
<div class="absolute inset-y-0 left-0 pl-4 flex items-center pointer-events-none">
<span class="material-symbols-outlined text-on-surface-variant group-focus-within:text-primary transition-colors" data-icon="lock">lock</span>
</div>
<input class="block w-full pl-12 pr-12 py-4 bg-surface-container-high border-none rounded-2xl focus:ring-2 focus:ring-primary/20 focus:bg-surface-container-lowest transition-all placeholder:text-outline-variant text-on-surface" id="password" placeholder="••••••••" type="password"/>
<button class="absolute inset-y-0 right-0 pr-4 flex items-center text-on-surface-variant">
<span class="material-symbols-outlined" data-icon="visibility">visibility</span>
</button>
</div>
</div>
<!-- Login Button -->
<button class="w-full py-4 bg-gradient-to-br from-primary to-primary-container text-on-primary font-headline font-bold text-lg rounded-2xl shadow-[0px_12px_32px_rgba(0,107,92,0.12)] active:scale-95 transition-transform duration-200">
                Masuk Ke Akun
            </button>
<!-- Divider -->
<div class="flex items-center gap-4 py-4">
<div class="h-[1px] flex-1 bg-outline-variant/30"></div>
<span class="text-xs font-bold text-outline uppercase tracking-tighter">Atau masuk dengan</span>
<div class="h-[1px] flex-1 bg-outline-variant/30"></div>
</div>
<!-- Social Login -->
<button class="w-full py-4 bg-surface-container-lowest border border-outline-variant/20 flex items-center justify-center gap-3 rounded-2xl hover:bg-surface-container-low active:scale-95 transition-all duration-200">
<img alt="Google" class="w-5 h-5" data-alt="Official Google G logo with clean white background and brand colors" src="https://lh3.googleusercontent.com/aida-public/AB6AXuCBYA2aY1k32vUunho0vRAj9lKg0qFviFRnSYx7ah2FYPqJhFFJXNORLZeNKkIHZhI7DkzsfFy-v8DnYfV3PW4J-WHwxjmIuWfZ5WNJJItDltIdQ31A_pVA1ik3kuef6ZJK4QxjglXoYFVEHKS7w7DaAXgnIXaRAPwcP607X5CcSQcZ0hc9bLjHXJ0Eei6YfXwJN2BtlF5VfmQrZJazLYXyMbL4ZD_Ehqj2bGYmnm7NjcTh3bUBjMP4QQcUmZiupBvZNUa7rq7dLeIf"/>
<span class="font-headline font-semibold text-on-surface">Lanjutkan dengan Google</span>
</button>
</div>
<!-- Footer Section -->
<div class="w-full text-center mt-12">
<p class="text-sm text-on-surface-variant font-medium">
                Belum punya akun? 
                <a class="text-primary font-bold hover:underline decoration-2 underline-offset-4 ml-1" href="#">Daftar</a>
</p>
</div>
</main>
<!-- Bottom Navigation Suppression: Not shown for transactional flow -->
<!-- Decorative Element: Asymmetric Energy Gradient -->
<div class="fixed top-[-10%] right-[-10%] w-[50%] h-[40%] bg-primary-container/10 rounded-full blur-[100px] -z-10"></div>
<div class="fixed bottom-[-10%] left-[-10%] w-[50%] h-[40%] bg-primary/5 rounded-full blur-[100px] -z-10"></div>
</body></html>
